spring.application.name=quiropracticoAPI
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=86400000

whatsapp.enabled=${WHATSAPP_ENABLED:false}
whatsapp.api-version=v21.0
whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:dummy_phone_id}
whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:dummy_token}
whatsapp.verify-token=${WHATSAPP_VERIFY_TOKEN:quiro_webhook_secret_2026}
whatsapp.template.confirmacion=${WHATSAPP_TEMPLATE_CONFIRMACION:confirmacion_cita_clinica}
whatsapp.template.recordatorio=${WHATSAPP_TEMPLATE_RECORDATORIO:recordatorio_cita_24h}
# ConfiguraciÃ³n Cloudflare R2 (Object Storage)
r2.endpoint=${R2_ENDPOINT}
r2.access-key=${R2_ACCESS_KEY}
r2.secret-key=${R2_SECRET_KEY}
r2.bucket-name=${R2_BUCKET_NAME}

# LÃ­mites de subida para documentos mÃ©dicos (RadiografÃ­as/PDFs)
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=15MB

# Debug de Seguridad
logging.level.org.springframework.security=DEBUG

# Orígenes permitidos CORS (separados por coma, soporta patrones con comodines)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
